# ── Why Robotmk ───────────────────────────────────────────────────────────────
why:
  eyebrow: "Warum Robotmk"
  heading: "Zahl für das, was zählt. Nicht dafür, mehr zu testen vorzugaukeln."
  body: "Manche Tools berechnen pro Netzwerk-Request, pro Check-Intervall, pro Minute. Checkmk Synthetic Monitoring berechnet genau eine Sache: die Anzahl der überwachten Testfälle. Teste so oft du willst, so gründlich du willst — der Preis bleibt gleich."
  stat_line: "Aktionsbasierte Wettbewerber können bis zu 10× teurer sein — und der Abstand wächst mit jedem kürzeren Testintervall."
  pillars:
    - icon: "🔓"
      label: "Open Source"
      text: "Robot Framework — kein Vendor Lock-in von Anfang an."
    - icon: "🔗"
      label: "Tiefste Integration"
      text: "Nativ in Checkmk integriert, nicht angeflanscht."
    - icon: "🧑‍💻"
      label: "Kein Personalrisiko"
      text: "Lesbar, wartbar — und > 40.000 Engineers kennen es bereits."
  cta: "Zum vollständigen Vergleich →"

# ── Founder ───────────────────────────────────────────────────────────────────
founder:
  heading: "Erfunden. Perfektioniert.<br>Und jetzt nativ in Checkmk."
  bio: "Ich bin <b>Simon Meggle</b>, der Gründer des Robotmk-Projektes.<br><br>Seit 2009 beschäftige ich mich mit der Frage, wie Monitoring über die Infrastruktur hinaus auch die Nutzersicht abbildet — und habe darauf eine Antwort gefunden.<br><br>Sie heißt <b>Robotmk</b>: eine Lösung, die Robot Framework-Tests direkt in Checkmk integriert, als wäre es von Anfang an dafür gebaut worden.<br><br>Und heute? Robotmk ist integraler Bestandteil von Checkmk. Und ich habe das Glück, in Teilzeit bei Checkmk als Produktmanager für meine eigene Erfindung zu arbeiten."
  badges:
    - "Gründer von ELABIT GmbH, Erfinder von Robotmk"
    - "Synthetic Monitoring Experte"
    - 'Robot Framework <a href="https://www.robotframework.org/ambassadors/" target="_blank" rel="noopener noreferrer">Ambassador</a>'
    - Mitglied der <a href="https://www.robotframework.org/foundation/" target="_blank" rel="noopener noreferrer">Robot Framework Foundation</a> 
    - Organisator der <a href="https://luma.com/rfugm" target="_blank" rel="noopener noreferrer">Robot Framework User Group München</a> 
    - 'Akkreditierter Trainer für das "Robot Framework Certified Professional" <a href="https://cert.robotframework.org" target="_blank" rel="noopener noreferrer">Examen</a>'
    - 'Senior Product Manager Synthetic Monitoring @ <a href="https://www.checkmk.com" target="_blank" rel="noopener noreferrer">Checkmk</a>'
    - 'Chilli-Nerd 🌶️'
  cta: "Meine Geschichte →"
  img_alt: "Simon Meggle, Erfinder von Robotmk"



