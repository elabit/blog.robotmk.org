stats:
  heading: "Die Wahrheit hinter grünen Dashboards:"
  source: 'Quelle: <a href="https://thenetworkinstallers.com/blog/cost-of-it-downtime-statistics/" target="_blank" rel="noopener noreferrer">The Network Installers — Cost of IT Downtime Statistics</a>'
  description: "Klassisches Monitoring überwacht das, was selten ausfällt: die Hardware.<br>Unbemerkt bleibt, was deine User tatsächlich erleben – einen scheiternden Login, eine langsam ladende Seite, einen Checkout, der hängt etc.<br><b>Fatal: Nutzerzufriedenheit und Umsatz entstehen dort, wo Monitoring-Systeme blind sind - auf der Applikationsebene.</b>"
  items:
    - number: "7"
      label: "von 10 IT-Ausfällen: menschengemacht."
    - number: "2.5×"
      label: "Kostensteigerung von 2014–2024 (Gartner/EMA)"
    - number: "$14,000"
      label: "Durchschnittliche Kosten einer Minute IT Ausfall (2026)"

