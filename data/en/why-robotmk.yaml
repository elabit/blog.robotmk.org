hero:
  eyebrow: "The Comparison"
  title: "Good reasons for Robotmk"
  subtitle: "A single variable - for a fair and transparent pricing model."

pricing:
  heading: "The cost trap"
  intro: "Most of the big platforms bill synthetic monitoring as a <b>product of several variables that compound each other</b>.<br><br>The easy, cheap start is paid for dearly later on, with a bill that doesn't grow linearly but exponentially 📈. <br><br><b>Robotmk</b> has only one variable: the test case.<br>One more test, one more predictable amount. <br>Because synthetic monitoring has to be able to grow with your requirements."
  formula_competitor: "number of tests <br>× interval <br>× requests/test <br>× rate"
  formula_checkmk: "number of tests <br>× rate"
  formula_competitor_label: "Competitors"
  formula_checkmk_label: "Robotmk"
  table:
    caption: "Example calculation: monthly cost for 15 test cases with 8 requests/test, executed at a 15-minute interval. (Illustrative example, not a current vendor quote.)"
    rows:
      - label: "Billed by"
        dynatrace: "Actions (requests)"
        datadog: "Test executions"
        grafana: "Test executions"
        checkmk: "🟢<br>Tests discovered in Checkmk (= services)"
      - label: "Rate"
        dynatrace: "$4.50 / 1k actions"
        datadog: "$12 / 1k executions"
        grafana: "$44 / 1k executions"
        checkmk: "🟢<br>flat rate"
      - label: "Cost / month<br>(15-min interval)"
        dynatrace: "€1,388"
        datadog: "€463"
        grafana: "€1,696"
        checkmk: "🟢<br>€135"
      - label: "Cost / month<br>(5-min interval)"
        dynatrace: "€4,162"
        datadog: "€1,388"
        grafana: "€5,088"
        checkmk: "🟢<br>€135"
  source_note: ""

fairness:
  label: "Note"
  heading: "For a fair comparison:"
  columns:
    - side: "cloud"
      label: "Cloud vendors"
      text: "Here the infrastructure is always included - you don't have to provide anything. <br>That's why you pay <b>per execution</b>, and that is exactly what produces the <b>exponential price curve</b>."
    - side: "robotmk"
      label: "Robotmk"
      text: "You provide the machines the tests run on. That means a little more <b>ownership during setup</b>."
  conclusion: "Using Robotmk for synthetic monitoring means: your machine, your data, your bill - all in your hands."

pillars:
  heading: "More reasons that go beyond price"
  more_label: "Learn more"
  items:
    - icon: "open-source"
      title: "Open source"
      text: "Robot Framework is open source - and has been for over 20 years."
      more: "Because the complete source code is out in the open, your security team can verify exactly what runs in your environment. No per-seat licence gate on the tooling itself."
    - icon: "no-lockin"
      title: "No vendor lock-in"
      text: "Portable test definitions, free of any vendor's proprietary format."
      more: "Robot Framework is a testing and automation tool used all over the world. Switch platforms and your tests move with you unchanged: no proprietary recorder format to re-author, no lossy export. The investment you make in your tests stays yours."
    - icon: "integration"
      title: "Deepest integration into Checkmk"
      text: "Robotmk is a native Checkmk extension."
      more: "No separate portal, no brittle API layers in between that have to be kept in sync. You get the same user experience you already know from Checkmk."
    - icon: "one-framework"
      title: "One framework for every technology"
      text: "Web, desktop, API, SAP, Citrix, mobile — Robot Framework is the Swiss Army knife of test automation."
      more: "Robot Framework offers a library for every technology and one consistent \"keyword\" syntax that makes writing tests easy."
    - icon: "bridge"
      title: "The Robotmk Bridge"
      text: "Already invested in JUnit, Tosca, Gatling, or ZAP? The Robotmk Bridge brings those results into Checkmk as well — with no rewriting at all."
      more: "The Robotmk Bridge picks up results from tools you already use and displays them as Checkmk services, right alongside your Robot Framework tests."
    - icon: "community"
      title: "The lingua franca of test automation"
      text: "Not a niche bet - Robot Framework has more than 40,000 users worldwide."
      more: "Robot Framework is the de-facto standard in test automation. You build on a living ecosystem, not on a single vendor's roadmap."
    - icon: "vscode"
      title: "RobotCode: first-class VS Code support"
      text: "With the RobotCode extension you build tests where your team already works — with autocompletion, a debugger and the test explorer."
      more: "RobotCode turns VS Code into a full-fledged IDE for Robot Framework, with code completion and a real debugger offering breakpoints and variable inspection - plus plenty of other features."
    - icon: "no-risk"
      title: "No talent risk"
      text: "Robot Framework is readable, maintainable and widely adopted. You won't struggle to hire for it, or to hand it over."
      more: "The clearly readable, keyword-driven syntax is extremely easy to read and maintain. Hiring is easier, onboarding is faster, and handovers don't escalate into refactoring projects."

explorer:
  interval_label: "Execution interval"
  interval_tooltip: "The shorter the interval, the better the detection rate: problems on the user's side can be fixed that much faster."
  interval_steps:
    - "30 min"
    - "15 min"
    - "5 min"
    - "1 min"
  test_case_slider_label: "Number of test cases"
  test_case_tooltip: "A test = a single, isolated, automatable user journey — the more targeted the monitoring, the more precise the alert when something breaks."
  y_axis_label: "Cost per month"
  readout_hint: ""
  # disclaimer: "Illustrative model, not a current vendor quote — uses the same example rate as above (8 requests/test, fixed, Dynatrace only). Grafana and Datadog bill by full test run, not by request. Checkmk's curve is interpolated between two real reference points from its own price list (15 test cases = €135/month; 1,000 test cases = €2,333/month) — the exact discount formula in between isn't published, so this is a plausible estimate, not an official quote. The scale is fixed on purpose: bars that exceed it are marked \"off the chart\" instead of silently rescaling the axis."
  disclaimer: ""
  requests_per_test: 8
  usd_to_eur: 0.88
  dynatrace_rate_usd_per_1k_actions: 4.50
  datadog_rate_usd_per_1k_runs: 12
  grafana_rate_usd_per_1k_runs: 44
  checkmk_min_price_eur: 135
  checkmk_max_price_eur: 2333
  test_case_min: 15
  test_case_max: 1000
  y_axis_max: 4000
  # 15 x 4 x 24 x (365/12) = 43800 executions / month
  # x 8 = 350,400 requests / month
  vendors:
    - key: "dynatrace"
      name: "Dynatrace"
      tooltip: "Billed per network request: interval × test cases × steps per test — all multiplied together."
    - key: "datadog"
      name: "Datadog"
      tooltip: "Billed per full test run: interval × test cases. Steps within a test are free."
    - key: "grafana"
      name: "Grafana"
      tooltip: "Same model as Datadog — billed per full test run, at a higher rate."
    - key: "checkmk"
      name: "<b>Robotmk</b>"
      tooltip: "Billed by number of test cases only. Interval and steps are always free."
